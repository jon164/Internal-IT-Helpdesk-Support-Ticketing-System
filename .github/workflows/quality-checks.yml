name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, tests, and smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and run backend tests
        run: dotnet test Helpdesk.slnx --configuration Release --logger "console;verbosity=normal"

      - name: Start API, verify technician endpoint and authentication
        shell: bash
        run: |
          set -euo pipefail

          log_file="$RUNNER_TEMP/helpdesk-api.log"
          ASPNETCORE_URLS="http://127.0.0.1:5099" \
            dotnet run --project src/Helpdesk.Api/Helpdesk.Api.csproj \
              --configuration Release --no-build --no-launch-profile \
              -- --urls http://127.0.0.1:5099 \
              >"$log_file" 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:5099/api/technicians \
              | jq -e 'type == "array"' >/dev/null; then
              echo "API smoke check passed: /api/technicians returned a JSON array."
              ready=1
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$log_file"
              echo "API process exited before the endpoint became ready." >&2
              exit 1
            fi

            sleep 2
          done

          if [ "${ready:-0}" != 1 ]; then
            cat "$log_file"
            echo "API did not become ready within 60 seconds." >&2
            exit 1
          fi

          base=http://127.0.0.1:5099
          expect_status() {
            local expected=$1 description=$2; shift 2
            local actual
            actual=$(curl --silent --output /dev/null --write-out '%{http_code}' "$@")
            if [ "$actual" != "$expected" ]; then
              echo "FAIL: $description — expected HTTP $expected, got $actual" >&2
              exit 1
            fi
            echo "PASS: $description (HTTP $actual)"
          }

          # Security smoke checks against the real running API (Production environment, so
          # no demo passwords are configured and no account should be able to sign in).
          expect_status 401 "/api/auth/me without a token is refused" "$base/api/auth/me"
          expect_status 401 "Naming an account in X-User-Id no longer grants access" -H "X-User-Id: it-manager" "$base/api/dashboard"
          expect_status 401 "A made-up bearer token is refused" -H "Authorization: Bearer forged" "$base/api/dashboard"
          expect_status 400 "Sign-in with blank credentials is rejected" -X POST -H "Content-Type: application/json" -d '{"username":"","password":""}' "$base/api/auth/login"
          expect_status 401 "Development demo password does not work outside Development" -X POST -H "Content-Type: application/json" -d '{"username":"it-manager","password":"Manager#Demo2026"}' "$base/api/auth/login"

          cache_control=$(curl --silent --output /dev/null --dump-header - -X POST -H "Content-Type: application/json" \
            -d '{"username":"nobody","password":"x"}' "$base/api/auth/login" | tr -d '\r' | grep -i '^cache-control:' || true)
          echo "$cache_control" | grep -qi 'no-store' || { echo "FAIL: login response must send Cache-Control: no-store (got '$cache_control')" >&2; exit 1; }
          echo "PASS: login response is not cacheable"

  client:
    name: Client build, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Lint client
        run: npm run lint

      - name: Run client tests (Vitest + axe-core accessibility checks)
        run: npm test
